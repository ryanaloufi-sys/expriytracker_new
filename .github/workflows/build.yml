name: Build Flutter App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Initialize Android V2 Scaffold
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/expriytracker_new
          
          # 1. AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' > android/app/src/main/AndroidManifest.xml
          echo '    <application android:label="expriytracker_new" android:name="${applicationName}" android:icon="@mipmap/ic_launcher">' >> android/app/src/main/AndroidManifest.xml
          echo '        <meta-data android:name="flutterEmbedding" android:value="2" />' >> android/app/src/main/AndroidManifest.xml
          echo '        <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">' >> android/app/src/main/AndroidManifest.xml
          echo '            <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />' >> android/app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> android/app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN"/>' >> android/app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER"/>' >> android/app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> android/app/src/main/AndroidManifest.xml
          echo '        </activity>' >> android/app/src/main/AndroidManifest.xml
          echo '    </application>' >> android/app/src/main/AndroidManifest.xml
          echo '</manifest>' >> android/app/src/main/AndroidManifest.xml

          # 2. MainActivity.kt
          echo 'package com.example.expriytracker_new' > android/app/src/main/kotlin/com/example/expriytracker_new/MainActivity.kt
          echo 'import io.flutter.embedding.android.FlutterActivity' >> android/app/src/main/kotlin/com/example/expriytracker_new/MainActivity.kt
          echo 'class MainActivity: FlutterActivity() {}' >> android/app/src/main/kotlin/com/example/expriytracker_new/MainActivity.kt

          # 3. build.gradle
          echo 'plugins { id "com.android.application"; id "kotlin-android"; id "dev.flutter.flutter-gradle-plugin" }' > android/app/build.gradle
          echo 'android {' >> android/app/build.gradle
          echo '    namespace "com.example.expriytracker_new"' >> android/app/build.gradle
          echo '    compileSdkVersion flutter.compileSdkVersion' >> android/app/build.gradle
          echo '    ndkVersion flutter.ndkVersion' >> android/app/build.gradle
          echo '    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }' >> android/app/build.gradle
          echo '    kotlinOptions { jvmTarget = "17" }' >> android/app/build.gradle
          echo '    defaultConfig { applicationId "com.example.expriytracker_new"; minSdkVersion flutter.minSdkVersion; targetSdkVersion flutter.targetSdkVersion; versionCode flutter.versionCode; versionName flutter.versionName }' >> android/app/build.gradle
          echo '    buildTypes { release { signingConfig signingConfigs.debug } }' >> android/app/build.gradle
          echo '}' >> android/app/build.gradle
          echo 'flutter { source "../.." }' >> android/app/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Generated AAB File
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
