name: Build Flutter App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean Project and Recreate Android Platform
        run: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android --project-name=expriytracker_new

      - name: Inject Permissions & Configure Gradle (SDK 34, MultiDex)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # إضافة الأذونات اللازمة لحزم الكاميرا والإشعارات قبل إغلاق الوسم manifest
          if [ -f "$MANIFEST" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA"/>' "$MANIFEST"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' "$MANIFEST"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE"/>' "$MANIFEST"
          fi

          BUILD_GRADLE="android/app/build.gradle"
          
          # ضبط إصدارات الـ SDK والـ MinSdk
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$BUILD_GRADLE" || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$BUILD_GRADLE" || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$BUILD_GRADLE" || true
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' "$BUILD_GRADLE" || true
          
          # تفعيل MultiDex وتتبع التبعيات
          sed -i '/defaultConfig {/a \ \ \ \ \ \ multiDexEnabled true' "$BUILD_GRADLE"

          echo "" >> "$BUILD_GRADLE"
          echo "dependencies {" >> "$BUILD_GRADLE"
          echo "    implementation 'androidx.multidex:multidex:2.0.1'" >> "$BUILD_GRADLE"
          echo "}" >> "$BUILD_GRADLE"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Generated AAB File
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
