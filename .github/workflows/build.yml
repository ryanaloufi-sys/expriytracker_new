name: Build Flutter Direct APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean Project and Recreate Android Platform
        run: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android --project-name=expriytracker_new

      - name: Configure Android Manifest & Gradle Safely
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # إضافة الأذونات اللازمة قبل إغلاق الوسم manifest
          if [ -f "$MANIFEST" ]; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA"/>' "$MANIFEST"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>' "$MANIFEST"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE"/>' "$MANIFEST"
          fi

          BUILD_GRADLE="android/app/build.gradle"
          
          # ضبط إصدارات الـ SDK وتفعيل MultiDex بداخل defaultConfig بسلام
          sed -i 's/minSdkVersion.*/minSdkVersion 21/' "$BUILD_GRADLE" || true
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/' "$BUILD_GRADLE" || true
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' "$BUILD_GRADLE" || true
          sed -i '/defaultConfig {/a \        multiDexEnabled true' "$BUILD_GRADLE"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release --verbose

      - name: Upload Generated APK File
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
