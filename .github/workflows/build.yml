name: Build Flutter App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean Project and Recreate Android Platform
        run: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android --project-name=expriytracker_new

      - name: Configure Gradle for Release & MultiDex
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          # ضبط الحد الأدنى لإصدار أندرويد إلى 21 لتوافق الحزم الحديثة
          if grep -q "minSdkVersion" "$BUILD_GRADLE"; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/' "$BUILD_GRADLE"
          fi
          # تفعيل MultiDex لتجاوز حد الأكواد في ملفات الـ Release
          if grep -q "defaultConfig {" "$BUILD_GRADLE"; then
            sed -i '/defaultConfig {/a \ \ \ \ \ \ multiDexEnabled true' "$BUILD_GRADLE"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release --verbose

      - name: Upload Generated AAB File
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
