name: Build Flutter App Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Clean Android Platform Structure
        run: |
          # مسح أي مجلد أندرويد قديم أو غير مكتمل
          rm -rf android
          # توليد هيكل أندرويد حديث ومتوافق تماماً مع V2 وحزم الإشعارات
          flutter create . --platforms=android --project-name=expriytracker_new

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release --verbose
